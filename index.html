
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22160F">
<title>Les mots que je me raconte — Aurore</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap');

:root{
 --espresso:#22160F;
 --chocolat:#4A3022;
 --cuivre:#A87443;
 --or:#E6C79A;
 --ivoire:#F5EDE1;
 --papier:#FBF6EE;
}
*{box-sizing:border-box}
html{background:var(--espresso)}
body{
 margin:0;min-height:100vh;
 background:var(--espresso);
 color:var(--ivoire);
 font-family:'DM Sans',sans-serif;
 overflow-x:hidden;
}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{
 outline:2px solid var(--or);outline-offset:4px;
}
button:disabled{opacity:.5;cursor:default}
#sky{
 position:fixed;inset:0;pointer-events:none;
 background:
 radial-gradient(ellipse at 50% 25%,#754a3066,transparent 60%),
 radial-gradient(ellipse at 90% 90%,#9b643022,transparent 45%),
 linear-gradient(155deg,#382419,#22160F 80%);
}
#sky:after{
 content:"";position:absolute;inset:0;
 background-image:radial-gradient(#e6c79a 1px,transparent 1px);
 background-size:41px 53px;opacity:.16;
}
.orb{
 position:absolute;border-radius:50%;
 filter:blur(55px);
 animation:drift 12s ease-in-out infinite alternate;
}
.orb.one{
 width:250px;height:250px;
 background:#a8744333;top:8%;left:-100px;
}
.orb.two{
 width:280px;height:280px;
 background:#d9b47e20;bottom:5%;right:-130px;
 animation-delay:-5s;
}
@keyframes drift{
 to{transform:translate(55px,85px) scale(1.2)}
}
#particles{
 position:fixed;inset:0;
 pointer-events:none;overflow:hidden;z-index:5;
}
.particle{
 position:absolute;width:4px;height:4px;
 border-radius:50%;background:var(--or);
 box-shadow:0 0 12px var(--or);
 animation:spark 1.3s ease-out forwards;
}
@keyframes spark{
 to{
  transform:translate(var(--dx),var(--dy)) scale(0);
  opacity:0;
 }
}
.app{
 position:relative;z-index:2;
 max-width:700px;min-height:100dvh;
 margin:auto;
 padding:25px 22px 50px;
 display:flex;flex-direction:column;
 justify-content:center;
}
.brand{
 text-align:center;color:var(--or);
 font-size:10px;letter-spacing:2.5px;
 text-transform:uppercase;margin-bottom:30px;
}
.screen{animation:enter .65s ease both}
@keyframes enter{
 from{opacity:0;transform:translateY(22px)}
 to{opacity:1;transform:translateY(0)}
}
.kicker{
 text-align:center;color:var(--or);
 font-size:10px;letter-spacing:3px;
 text-transform:uppercase;margin-bottom:20px;
}
h1,h2,h3{
 font-family:'Cormorant Garamond',Georgia,serif;
 font-weight:500;text-align:center;
 line-height:1.08;
}
h1{font-size:clamp(51px,11vw,83px);margin:0 0 22px}
h2{font-size:clamp(37px,8vw,58px);margin:0 0 22px}
h3{font-size:32px}
.script{
 font-family:'Great Vibes',cursive;
 color:var(--or);font-weight:400;
}
.lead{
 font-size:16px;line-height:1.9;
 text-align:center;color:#f0dfce;
 max-width:520px;margin:0 auto 25px;
}
.muted{
 text-align:center;color:#c6a88a;
 font-size:12px;line-height:1.8;
}
.symbol{
 text-align:center;font-size:36px;
 color:var(--or);margin-bottom:20px;
 animation:pulse 3s ease-in-out infinite;
}
@keyframes pulse{
 50%{opacity:.55;transform:scale(1.15)}
}
.primary{
 display:block;width:100%;
 border:1px solid #f3d8aa;
 border-radius:50px;
 background:linear-gradient(120deg,#f2d9ad,#b9844c);
 color:#2d1c11;
 padding:18px 24px;
 font-weight:600;font-size:14px;
 margin:23px 0 12px;
 text-align:center;text-decoration:none;
 box-shadow:0 8px 30px #a8744329;
 transition:transform .2s,box-shadow .2s;
}
.primary:active{transform:scale(.97)}
.secondary{
 display:block;width:100%;
 background:transparent;color:var(--or);
 border:1px solid #a8744388;
 border-radius:50px;padding:16px;
 margin:12px 0;text-align:center;
 text-decoration:none;
}
.progress{
 display:flex;gap:8px;
 max-width:350px;margin:0 auto 35px;
}
.progress span{
 width:60px;height:2px;background:#76533c;
}
.progress span.on{
 background:var(--or);
 box-shadow:0 0 10px #e6c79a99;
}
.choices{display:grid;gap:12px;margin:25px 0}
.choice{
 width:100%;text-align:left;
 border:1px solid #b88c6255;
 border-radius:17px;
 padding:19px 18px;
 background:linear-gradient(110deg,#ffffff0c,#ffffff04);
 color:var(--ivoire);
 font-size:15px;line-height:1.55;
 transition:background .25s,transform .25s,border-color .25s;
}
.choice:active{transform:scale(.98)}
.choice.selected{
 border-color:var(--or);
 background:#a8744333;
}
.choice .star{color:var(--or);margin-right:10px}
.floating{
 height:180px;position:relative;
 margin-bottom:10px;
}
.floating span{
 position:absolute;
 color:#e6c79a99;
 font-family:'Cormorant Garamond',serif;
 font-style:italic;font-size:20px;
 animation:float 5s ease-in-out infinite alternate;
}
.floating span:nth-child(1){top:10%;left:3%}
.floating span:nth-child(2){top:20%;right:0;animation-delay:-2s}
.floating span:nth-child(3){bottom:10%;left:9%;animation-delay:-3s}
.floating span:nth-child(4){bottom:4%;right:6%;animation-delay:-1s}
.floating .center{
 position:absolute;left:50%;top:50%;
 transform:translate(-50%,-50%);
 font-size:54px;color:var(--or);
 text-shadow:0 0 45px #e6c79a;
}
@keyframes float{
 to{transform:translateY(-17px);opacity:.45}
}
.note{
 border-left:1px solid var(--cuivre);
 padding:16px 20px;
 background:#ffffff09;
 color:#f0ddc7;
 line-height:1.85;
 font-family:'Cormorant Garamond',serif;
 font-size:24px;
 margin:25px 0;
}
.paper{
 background:
 radial-gradient(ellipse at 50% 10%,#fffefa,#f0dfc8 75%,#e2c9a9);
 color:var(--chocolat);
 padding:40px 26px;
 border:1px solid #fff8eb;
 border-radius:7px;
 box-shadow:0 18px 65px #0008;
 text-align:center;
 position:relative;overflow:hidden;
}
.paper:before{
 content:"";
 position:absolute;inset:10px;
 border:1px solid #a8744355;
 pointer-events:none;
}
.paper h2{color:var(--chocolat)}
.paper p{font-size:16px;line-height:1.9}
.paper .kicker{color:#8b623e}
.divider{
 height:1px;width:90px;
 background:linear-gradient(90deg,transparent,var(--cuivre),transparent);
 margin:25px auto;
}
.oldwords{
 font-family:'Cormorant Garamond',serif;
 font-size:clamp(29px,7vw,43px);
 text-align:center;
 color:#f2d9c0;
 line-height:1.4;
 min-height:135px;
 display:flex;align-items:center;justify-content:center;
 transition:opacity .65s,filter .65s,transform .65s;
}
.oldwords.dissolve{
 opacity:0;filter:blur(14px);transform:scale(1.2);
}
.newwords{
 font-family:'Cormorant Garamond',serif;
 font-size:clamp(30px,7vw,45px);
 text-align:center;color:var(--or);
 line-height:1.4;
 animation:reveal 1.2s ease both;
}
@keyframes reveal{
 from{opacity:0;filter:blur(15px);transform:scale(.9)}
 to{opacity:1;filter:blur(0);transform:scale(1)}
}
input{
 width:100%;padding:18px;
 background:var(--papier);
 border:1px solid var(--cuivre);
 border-radius:12px;
 color:var(--chocolat);
 font-size:18px;text-align:center;
}
.mantra{
 font-family:'Cormorant Garamond',serif;
 font-size:clamp(22px,5vw,29px);
 line-height:1.55;
 white-space:pre-line;
}
.mantra-line{
 display:block;opacity:0;
 transform:translateY(10px);
 animation:lineIn .65s ease forwards;
}
@keyframes lineIn{
 to{opacity:1;transform:translateY(0)}
}
.action{
 padding:25px;border:1px solid #a8744377;
 border-radius:20px;
 background:#ffffff0a;
 margin:25px 0;text-align:center;
}
.action p{line-height:1.8}
.footer{
 text-align:center;color:#aa8a70;
 font-size:10px;letter-spacing:1px;
 margin-top:35px;
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{
  animation-duration:.01ms!important;
  transition-duration:.01ms!important;
 }
}
</style>
</head>
<body>
<div id="sky" aria-hidden="true">
 <div class="orb one"></div>
 <div class="orb two"></div>
</div>
<div id="particles" aria-hidden="true"></div>

<main class="app">
 <div class="brand">Les soins de lumière d'Aurore</div>
 <div id="progress" class="progress"></div>
 <section id="screen" class="screen"></section>
 <footer class="footer">✦ UN PETIT MOMENT RIEN QUE POUR TOI ✦</footer>
</main>

<script>
"use strict";

const screen=document.getElementById("screen");
const progress=document.getElementById("progress");
const particleLayer=document.getElementById("particles");

let step=0;
let answers=[];
let chosen=0;
let firstName="";
let profile="place";
let busy=false;

const keys=["place","regard","choix","intuition","merite"];

const data={
 place:{
  title:"Tu doutes de ce que tu es capable de faire",
  old:"Je ne suis pas capable.",
  text:"Tu sais ce que je remarque ? Tu as peut-être tendance à te demander si tu vas y arriver avant même d'avoir essayé. Et pendant ce temps-là, il y a des choses qui te tiennent à cœur et que tu repousses.",
  affirm:"Je peux avancer, même quand je doute.",
  action:"Choisis une chose que tu repousses depuis un moment. Et aujourd'hui, fais juste le premier petit pas. Même minuscule.",
  more:["J'ai le droit d'apprendre en avançant.","Je peux prendre ma place à mon rythme."]
 },
 regard:{
  title:"Le regard des autres prend beaucoup de place",
  old:"Qu'est-ce qu'ils vont penser de moi ?",
  text:"Tu connais ce moment où tu sais ce que tu voudrais faire, mais tu imagines déjà ce que les autres vont en penser ? À force, on peut finir par oublier ce qu'on voulait vraiment, nous.",
  affirm:"Je peux être moi, même si ça ne plaît pas à tout le monde.",
  action:"Aujourd'hui, fais un petit choix juste pour toi. Sans demander trois avis avant.",
  more:["Mon avis compte aussi.","J'ai le droit d'avoir mes propres envies."]
 },
 choix:{
  title:"Tu as tendance à t'oublier",
  old:"Les autres passent avant moi.",
  text:"J'ai l'impression que tu sais très bien être là pour les autres. Mais quand il s'agit de toi, c'est une autre histoire. Et si tes besoins avaient le droit de compter autant que les leurs ?",
  affirm:"J'ai le droit de me choisir sans culpabiliser.",
  action:"Aujourd'hui, accorde-toi quinze minutes pour quelque chose qui te fait vraiment plaisir. Sans te justifier.",
  more:["Mes besoins comptent aussi.","Je peux dire non quand j'en ai besoin."]
 },
 intuition:{
  title:"Tu remets souvent tes choix en question",
  old:"Et si je me trompais ?",
  text:"Tu sais, parfois on ressent quelque chose, on a une envie, une idée… Et puis le cerveau arrive avec ses mille questions. Résultat, on tourne en rond. Ça te parle ?",
  affirm:"J'apprends à faire confiance à mes choix.",
  action:"Aujourd'hui, prends une petite décision sans la retourner dix fois dans ta tête.",
  more:["J'écoute davantage ce que je ressens.","Je peux avancer sans avoir toutes les réponses."]
 },
 merite:{
  title:"Tu as du mal à reconnaître ta propre valeur",
  old:"Je ne mérite peut-être pas tout ça.",
  text:"Tu as peut-être cette habitude de minimiser ce que tu fais, ce que tu réussis, ou même ce dont tu rêves. Comme s'il fallait toujours en faire encore plus. Et si tu pouvais déjà reconnaître tout ce que tu es ?",
  affirm:"Je mérite aussi de belles choses.",
  action:"Aujourd'hui, note trois choses dont tu peux être fière. Même les toutes petites.",
  more:["Ma valeur ne dépend pas de mes réussites.","Je peux accueillir ce qui me fait du bien."]
 }
};

const questions=[
 {
  heading:"On commence par là",
  intro:"Dis-moi… quand tu aimerais changer quelque chose dans ta vie, qu'est-ce qui te freine le plus souvent ?",
  options:[
   ["J'ai peur de ne pas être capable d'y arriver.","place"],
   ["Je pense beaucoup à ce que les autres vont en dire.","regard"],
   ["Je finis toujours par faire passer les autres avant moi.","choix"],
   ["Je doute tellement de mes choix que je reste bloquée.","intuition"],
   ["Au fond, j'ai du mal à croire que je mérite mieux.","merite"]
  ]
 },
 {
  heading:"Et dans la vraie vie ?",
  intro:"Quand cette peur ou ce doute prend le dessus, qu'est-ce que tu as tendance à faire ?",
  options:[
   ["Je repousse les choses, même celles qui me tiennent à cœur.","place"],
   ["Je cherche à être rassurée ou à avoir l'avis des autres.","regard"],
   ["Je dis oui alors qu'au fond, j'aimerais dire non.","choix"],
   ["Je réfléchis tellement que je finis par ne rien décider.","intuition"],
   ["Je minimise mes envies ou mes réussites.","merite"]
  ]
 },
 {
  heading:"Et si ça changeait ?",
  intro:"Si tu pouvais te libérer un peu de ce qui te freine aujourd'hui, qu'aimerais-tu réussir à faire ?",
  options:[
   ["Oser me lancer, même sans être certaine de réussir.","place"],
   ["Être moi-même sans avoir constamment peur du jugement.","regard"],
   ["Me choisir sans culpabiliser.","choix"],
   ["Faire davantage confiance à mes choix et à mes ressentis.","intuition"],
   ["Me sentir digne de recevoir de belles choses.","merite"]
  ]
 }
];

function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}

function render(html){
 screen.classList.remove("screen");
 screen.innerHTML=html;
 void screen.offsetWidth;
 screen.classList.add("screen");
 window.scrollTo({top:0,behavior:"instant"});
}

function setProgress(n){
 progress.innerHTML="";
 if(n===0)return;
 for(let i=0;i<5;i++){
  const s=document.createElement("span");
  if(i<n)s.className="on";
  progress.appendChild(s);
 }
}

function sparks(x,y,count=35){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 for(let i=0;i<count;i++){
  const p=document.createElement("span");
  p.className="particle";
  const angle=Math.random()*Math.PI*2;
  const distance=35+Math.random()*170;
  p.style.left=x+"px";
  p.style.top=y+"px";
  p.style.setProperty("--dx",Math.cos(angle)*distance+"px");
  p.style.setProperty("--dy",Math.sin(angle)*distance+"px");
  particleLayer.appendChild(p);
  p.addEventListener("animationend",()=>p.remove(),{once:true});
 }
}

function centerSparks(){
 sparks(innerWidth/2,innerHeight/2);
}

function welcome(){
 setProgress(0);
 render(`
  <div class="floating" aria-hidden="true">
   <span>Je doute...</span>
   <span>Et si je me trompais ?</span>
   <span>Je devrais...</span>
   <span>Je n'ose pas...</span>
   <div class="center">✧</div>
  </div>
  <div class="kicker">Une petite expérience pour toi</div>
  <h1>Les mots que<br><span class="script">je me raconte</span></h1>
  <p class="lead">
   Tu sais, cette petite voix dans ta tête
   qui a toujours quelque chose à dire ?
   <br><br>
   Celle qui te fait douter alors qu'il y a
   deux minutes, tu étais super motivée ?
   <br><br>
   Eh bien aujourd'hui, on va lui prêter
   un peu attention.
   <br><br>
   Allez, viens. J'ai trois petites
   questions pour toi. ❤️
  </p>
  <button class="primary" onclick="start()">
   Allez, on regarde ça ensemble ✦
  </button>
  <p class="muted">Environ 5 minutes, tranquillement.</p>
 `);
}

function start(){
 step=0;answers=[];chosen=0;firstName="";
 busy=false;
 question();
}

function question(){
 setProgress(step+1);
 const q=questions[step];
 let html=`
  <div class="kicker">0${step+1} / 03</div>
  <div class="symbol">✧</div>
  <h2>${q.heading}</h2>
  <p class="lead">${q.intro}</p>
  <div class="choices">`;

 q.options.forEach((o,i)=>{
  html+=`
   <button class="choice" onclick="answer(${i},this)">
    <span class="star">✦</span>${esc(o[0])}
   </button>`;
 });
 html+=`</div>
 <p class="muted">Choisis ce qui te ressemble le plus aujourd'hui.</p>`;
 render(html);
}

function answer(i,button){
 if(busy)return;
 busy=true;
 button.classList.add("selected");
 const r=button.getBoundingClientRect();
 sparks(r.left+r.width/2,r.top+r.height/2,16);
 answers.push(questions[step].options[i][1]);
 step++;

 setTimeout(()=>{
  busy=false;
  if(step<3)transition();
  else finalTransition();
 },450);
}

function transition(){
 const lines=[
  "Tu vois… parfois, on a tellement l'habitude de penser comme ça qu'on ne s'en rend même plus compte.",
  "Et maintenant, j'aimerais te poser une dernière petite question."
 ];
 const message=lines[step-1]||lines[0];
 render(`
  <div class="symbol">✦</div>
  <h2>Attends, juste<br><span class="script">une seconde...</span></h2>
  <div class="note">${message}</div>
  <button class="primary" onclick="question()">
   On continue ✦
  </button>
 `);
}

function finalTransition(){
 setProgress(3);
 render(`
  <div class="symbol">✧</div>
  <h2>Tu sais quoi ?<br><span class="script">C'est intéressant...</span></h2>
  <p class="lead">
   En trois petites questions, tu viens déjà
   de mettre des mots sur certaines choses.
   <br><br>
   Et parfois, rien que ça, ça fait du bien.
   <br><br>
   Maintenant, j'aimerais te montrer
   ce qui ressort de tes réponses.
  </p>
  <button class="primary" onclick="reveal()">
   Je veux voir ✦
  </button>
 `);
}

function determine(){
 const scores={};
 keys.forEach(k=>scores[k]=0);
 answers.forEach(k=>scores[k]++);
 profile=answers[0];
 keys.forEach(k=>{
  if(scores[k]>scores[profile])profile=k;
 });
}

function reveal(){
 determine();
 setProgress(4);
 const p=data[profile];
 render(`
  <div class="kicker">Ce que tes réponses racontent</div>
  <div class="paper">
   <h2>${p.title}</h2>
   <div class="divider"></div>
   <p>${p.text}</p>
  </div>
  <p class="muted" style="margin-top:25px">
   Ce n'est pas une étiquette ni une vérité absolue.
   Juste une piste pour regarder les choses autrement.
  </p>
  <button class="primary" onclick="transform()">
   Et si on changeait ces mots ? ✦
  </button>
 `);
}

function transform(){
 const p=data[profile];
 render(`
  <div class="kicker">Les mots peuvent changer</div>
  <h2>Cette petite phrase<br><span class="script">dans ta tête...</span></h2>
  <div id="old" class="oldwords">
   « ${p.old} »
  </div>
  <p class="muted">
   Et si tu essayais de te dire autre chose ?
  </p>
  <button id="transformButton" class="primary"
    onclick="doTransform()">
   Transformer ces mots ✦
  </button>
 `);
}

function doTransform(){
 const old=document.getElementById("old");
 const btn=document.getElementById("transformButton");
 if(!old||!btn)return;
 btn.disabled=true;
 old.classList.add("dissolve");
 centerSparks();

 setTimeout(()=>{
  old.outerHTML=`
   <div class="newwords">
    « ${data[profile].affirm} »
   </div>`;
  btn.outerHTML=`
   <p class="lead" style="margin-top:30px">
    Tu n'es pas obligée d'y croire à 100 %
    tout de suite.
    <br>
    Mais tu peux commencer à laisser
    un peu de place à cette idée.
   </p>
   <button class="primary" onclick="chooseWords()">
    Je veux mon mantra ✦
   </button>`;
 },750);
}

function affirmations(){
 const result=[];
 answers.forEach(k=>{
  const a=data[k].affirm;
  if(!result.includes(a))result.push(a);
 });
 for(const extra of data[profile].more){
  if(result.length>=3)break;
  if(!result.includes(extra))result.push(extra);
 }
 return result.slice(0,3);
}

function chooseWords(){
 const list=affirmations();
 let html=`
  <div class="kicker">Des mots rien que pour toi</div>
  <h2>Qu'est-ce que tu aimerais<br><span class="script">te dire aujourd'hui ?</span></h2>
  <p class="lead">
   J'ai préparé quelques phrases à partir
   de tes réponses.
   <br><br>
   Choisis celle qui te parle le plus.
  </p>
  <div class="choices">`;

 list.forEach((a,i)=>{
  html+=`
   <button class="choice" onclick="selectAffirm(${i})">
    <span class="star">✧</span>${esc(a)}
   </button>`;
 });
 html+="</div>";
 render(html);
}

function selectAffirm(i){
 chosen=i;
 setProgress(5);
 render(`
  <div class="symbol">✦</div>
  <h2>Encore une toute<br><span class="script">petite chose...</span></h2>
  <p class="lead">
   J'aimerais que ce mantra soit vraiment le tien.
   Alors dis-moi, comment tu t'appelles ?
  </p>
  <label class="kicker" for="firstname"
   style="display:block">TON PRÉNOM</label>
  <input id="firstname" maxlength="35"
   autocomplete="given-name"
   placeholder="Écris ton prénom ici">
  <button class="primary" onclick="makeMantra()">
   Découvrir mon mantra ✦
  </button>
 `);
}

function mantraLines(){
 const list=affirmations();
 const selected=list[chosen];
 const others=list.filter((_,i)=>i!==chosen);
 const name=firstName||"moi";
 const lines=[
  "Moi, "+name+",",
  "",
  selected,
  ...others,
  "Je m'autorise à avancer à mon rythme.",
  "Je fais de la place à ce qui me fait du bien.",
  "J'apprends à m'écouter davantage.",
  "Mes envies comptent aussi.",
  "Je mérite une vie qui me ressemble.",
  "Je me choisis.",
  "Je suis à ma place.",
  "Je suis moi."
 ];
 return lines.filter((line,i)=>line===""||
  lines.indexOf(line)===i);
}

 const el=document.getElementById("firstname");
 firstName=(el?el.value:"").trim().slice(0,35);

function copyMantra(){
 const text=mantraLines().join("\n");
 const feedback=document.getElementById("feedback");
 if(navigator.clipboard&&window.isSecureContext){
  navigator.clipboard.writeText(text).then(()=>{
   feedback.textContent="Ton mantra est copié ❤️";
  }).catch(()=>fallbackCopy(text));
 }else fallbackCopy(text);
}

function fallbackCopy(text){
 const area=document.createElement("textarea");
 area.value=text;
 area.style.position="fixed";
 area.style.opacity="0";
 document.body.appendChild(area);
 area.select();
 let ok=false;
 try{ok=document.execCommand("copy")}catch(e){}
 area.remove();
 document.getElementById("feedback").textContent=
  ok?"Ton mantra est copié ❤️":
  "Tu peux sélectionner le mantra pour le copier.";
}

function saveImage(){
 const canvas=document.createElement("canvas");
 canvas.width=1080;
 canvas.height=1600;
 const ctx=canvas.getContext("2d");
 if(!ctx)return;

 const bg=ctx.createLinearGradient(0,0,1080,1600);
 bg.addColorStop(0,"#FFF9EF");
 bg.addColorStop(1,"#E8D5BB");
 ctx.fillStyle=bg;
 ctx.fillRect(0,0,1080,1600);

 ctx.strokeStyle="#A87443";
 ctx.lineWidth=3;
 ctx.strokeRect(45,45,990,1510);
 ctx.strokeStyle="#A8744377";
 ctx.lineWidth=1;
 ctx.strokeRect(60,60,960,1480);

 ctx.textAlign="center";
 ctx.fillStyle="#A87443";
 ctx.font="52px Georgia";
 ctx.fillText("✦",540,160);

 ctx.fillStyle="#4A3022";
 ctx.font="60px Georgia";
 ctx.fillText("Mon mantra personnel",540,250);

 ctx.strokeStyle="#A87443";
 ctx.beginPath();
 ctx.moveTo(390,305);
 ctx.lineTo(690,305);
 ctx.stroke();

 const lines=mantraLines();
 const textLines=[];

 ctx.font="37px Georgia";
 const maxWidth=850;

 for(const line of lines){
  if(!line){
   textLines.push("");
   continue;
  }
  const words=line.split(" ");
  let current="";
  for(const word of words){
   const trial=current?current+" "+word:word;
   if(ctx.measureText(trial).width>maxWidth&&current){
    textLines.push(current);
    current=word;
   }else current=trial;
  }
  if(current)textLines.push(current);
 }

 const lineHeight=Math.min(72,1050/Math.max(textLines.length,1));
 const fontSize=Math.min(37,lineHeight*.67);
 ctx.font=fontSize+"px Georgia";
 ctx.fillStyle="#4A3022";

 let y=375;
 for(const line of textLines){
  if(line)ctx.fillText(line,540,y);
  y+=lineHeight;
 }

 ctx.strokeStyle="#A87443";
 ctx.beginPath();
 ctx.moveTo(390,1450);
 ctx.lineTo(690,1450);
 ctx.stroke();

 ctx.font="25px Georgia";
 ctx.fillStyle="#8B623E";
 ctx.fillText("Les soins de lumière d'Aurore",540,1500);

 canvas.toBlob(blob=>{
  if(!blob)return;
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="mon-mantra-aurore.png";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
  const feedback=document.getElementById("feedback");
  if(feedback)feedback.textContent=
   "Ta carte est prête. Retrouve-la dans tes téléchargements ❤️";
 },"image/png");
}

welcome();
</script>
