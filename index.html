
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#22160F">
<title>Les mots que je me raconte</title>
<style>
:root{
  --dark:#22160F;
  --brown:#4A3022;
  --gold:#E6C79A;
  --copper:#A87443;
  --ivory:#F5EDE1;
  --paper:#FBF6EE;
}
*{box-sizing:border-box}
html{background:var(--dark)}
body{
  margin:0;
  min-height:100vh;
  color:var(--ivory);
  font-family:Georgia,serif;
  background:
    radial-gradient(ellipse at 50% 15%,#70482d 0%,transparent 60%),
    linear-gradient(155deg,#362116,#22160F 80%);
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.22;
  background-image:
    radial-gradient(#E6C79A 1px,transparent 1px);
  background-size:43px 47px;
}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:3px;
}
.app{
  position:relative;
  z-index:1;
  max-width:640px;
  min-height:100dvh;
  margin:auto;
  padding:28px 22px 45px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.brand{
  text-align:center;
  color:var(--gold);
  font:10px Arial,sans-serif;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:35px;
}
.progress{
  display:flex;
  gap:7px;
  margin-bottom:32px;
}
.progress span{
  height:2px;
  flex:1;
  background:#806048;
  opacity:.4;
}
.progress span.active{
  background:var(--gold);
  opacity:1;
}
.screen{animation:fade .5s ease both}
@keyframes fade{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}
.symbol{
  text-align:center;
  font-size:42px;
  color:var(--gold);
  margin-bottom:22px;
  text-shadow:0 0 25px #E6C79A88;
}
.eyebrow{
  text-align:center;
  font:11px Arial,sans-serif;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:22px;
}
h1,h2{
  font-weight:normal;
  text-align:center;
  line-height:1.2;
  margin:0 0 25px;
}
h1{font-size:clamp(42px,10vw,65px)}
h2{font-size:clamp(29px,7vw,43px)}
em{color:var(--gold);font-weight:normal}
.bodytext{
  font-size:17px;
  line-height:1.85;
  text-align:center;
  color:#ead9c7;
  max-width:500px;
  margin:0 auto 26px;
}
.primary{
  width:100%;
  border:1px solid var(--gold);
  border-radius:40px;
  background:linear-gradient(120deg,#E6C79A,#B98952);
  color:#28190f;
  padding:19px;
  font-size:15px;
  font-weight:bold;
  margin:20px 0 10px;
}
.secondary{
  width:100%;
  border:1px solid #B98952;
  border-radius:40px;
  background:transparent;
  color:var(--gold);
  padding:16px;
  margin:12px 0;
}
.choices{
  display:grid;
  gap:12px;
  margin:25px 0;
}
.choice{
  text-align:left;
  width:100%;
  border:1px solid #D9B47E66;
  border-radius:16px;
  background:#F5EDE10D;
  color:var(--ivory);
  padding:19px;
  line-height:1.5;
  font-size:16px;
  transition:.2s;
}
.choice.selected{
  background:#D9B47E2B;
  border-color:var(--gold);
}
.choice .star{
  color:var(--gold);
  margin-right:10px;
}
.goldline{
  width:80px;
  height:1px;
  margin:25px auto;
  background:linear-gradient(90deg,transparent,var(--copper),transparent);
}
.paper{
  background:linear-gradient(145deg,#FFF9EF,#E8D5BB);
  color:var(--brown);
  border-radius:8px;
  padding:35px 25px;
  text-align:center;
  box-shadow:0 15px 55px #0006;
}
.paper::before{
  content:"✦";
  display:block;
  font-size:26px;
  color:var(--copper);
  margin-bottom:18px;
}
.paper h2{color:var(--brown)}
.paper p{line-height:1.85}
.paper .eyebrow{color:#8C6545}
.quote{
  font-size:22px;
  line-height:1.65;
  font-style:italic;
  color:var(--gold);
  text-align:center;
  margin:25px 0;
}
.mantra{
  white-space:pre-line;
  line-height:2;
  font-size:18px;
}
.small{
  text-align:center;
  color:#CCAF93;
  font-size:13px;
  line-height:1.7;
}
input{
  width:100%;
  padding:17px;
  border-radius:12px;
  border:1px solid var(--copper);
  background:#FFF9EF;
  color:var(--brown);
  text-align:center;
  font-size:17px;
}
.footer{
  text-align:center;
  margin-top:35px;
  color:#B99A7D;
  font:10px Arial,sans-serif;
  letter-spacing:1px;
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>
<main class="app">
  <div class="brand">Les soins de lumière d'Aurore</div>
  <div id="progress" class="progress"></div>

  <section id="screen" class="screen" aria-live="polite">
    <div class="symbol">✧</div>
    <h1>Les mots que<br><em>je me raconte</em></h1>
    <p class="bodytext">
      Il y a des mots que tu te répètes depuis si longtemps
      que tu as fini par les croire.
      <br><br>
      Et si, aujourd'hui, tu pouvais en choisir d'autres ?
    </p>
    <button class="primary" onclick="start()">
      Découvrir mes mots ✦
    </button>
    <p class="small">Quelques minutes, juste pour toi.</p>
  </section>

  <footer class="footer">
    UNE EXPÉRIENCE INTÉRIEURE ✧
  </footer>
</main>

<script>
"use strict";

const screen=document.getElementById("screen");
const progress=document.getElementById("progress");

let step=0;
let answers=[];
let profile="place";
let selectedAffirmation=0;
let firstName="";

const categories={
  place:{
    title:"La peur de ne pas être à la hauteur",
    old:"Je ne suis peut-être pas capable.",
    insight:"Tu sembles parfois douter de tes capacités avant même de t'être donné la possibilité d'essayer. Peut-être que tu attends d'être totalement prête pour oser avancer.",
    affirmation:"Je peux avancer même lorsque je doute.",
    action:"Aujourd'hui, fais un petit pas vers quelque chose que tu repousses depuis un moment."
  },
  regard:{
    title:"Le poids du regard des autres",
    old:"Que vont-ils penser de moi ?",
    insight:"L'avis des autres semble parfois prendre beaucoup de place dans tes décisions. Et dans tout ça, il est possible que tes propres envies passent au second plan.",
    affirmation:"Je m'autorise à être moi, même si je ne plais pas à tout le monde.",
    action:"Aujourd'hui, fais un choix qui te ressemble sans demander l'avis de quelqu'un d'autre."
  },
  choix:{
    title:"La difficulté à te choisir",
    old:"Je dois penser aux autres avant moi.",
    insight:"Tu sembles avoir pris l'habitude de faire passer les besoins des autres avant les tiens. À force, il devient parfois difficile de t'accorder la même attention.",
    affirmation:"Mes besoins ont aussi leur importance.",
    action:"Accorde-toi quinze minutes rien que pour toi, sans chercher à les justifier."
  },
  intuition:{
    title:"Le doute envers tes propres ressentis",
    old:"Et si je me trompais ?",
    insight:"Tu peux ressentir quelque chose très clairement, puis commencer à le remettre en question. Peut-être que tu cherches souvent une confirmation extérieure avant de faire confiance à ton jugement.",
    affirmation:"J'apprends à écouter ce que je ressens.",
    action:"Aujourd'hui, note un ressenti personnel sans chercher immédiatement à le faire valider."
  },
  merite:{
    title:"La difficulté à reconnaître ta valeur",
    old:"Je ne mérite peut-être pas mieux.",
    insight:"Tu sembles parfois minimiser tes envies ou tes réussites. Comme si tu devais toujours en faire davantage avant de pouvoir accueillir de belles choses.",
    affirmation:"Je mérite de vivre des choses qui me font du bien.",
    action:"Aujourd'hui, accueille un compliment ou une attention avec un simple merci."
  }
};

const questions=[
  {
    heading:"Ce qui me freine",
    title:"Quand tu aimerais changer quelque chose dans ta vie, qu'est-ce qui te freine le plus souvent ?",
    options:[
      ["J'ai peur de ne pas être capable d'y arriver.","place"],
      ["Je pense beaucoup à ce que les autres vont en dire.","regard"],
      ["Je finis toujours par faire passer les autres avant moi.","choix"],
      ["Je doute tellement de mes choix que je reste bloquée.","intuition"],
      ["Au fond, j'ai du mal à croire que je mérite mieux.","merite"]
    ]
  },
  {
    heading:"Ce que ça change dans mon quotidien",
    title:"Quand cette peur ou ce doute prend le dessus, qu'est-ce que tu as tendance à faire ?",
    options:[
      ["Je repousse les choses, même celles qui me tiennent à cœur.","place"],
      ["Je cherche à être rassurée ou à avoir l'avis des autres.","regard"],
      ["Je dis oui alors qu'au fond, j'aimerais dire non.","choix"],
      ["Je réfléchis tellement que je finis par ne rien décider.","intuition"],
      ["Je minimise mes envies ou mes réussites.","merite"]
    ]
  },
  {
    heading:"Ce que j'aimerais m'autoriser",
    title:"Si tu pouvais te libérer un peu de ce qui te freine aujourd'hui, qu'aimerais-tu réussir à faire ?",
    options:[
      ["Oser me lancer, même sans être certaine de réussir.","place"],
      ["Être moi-même sans avoir constamment peur du jugement.","regard"],
      ["Me choisir sans culpabiliser.","choix"],
      ["Faire davantage confiance à mes choix et à mes ressentis.","intuition"],
      ["Me sentir digne de recevoir de belles choses.","merite"]
    ]
  }
];

function escapeHTML(str){
  return String(str).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function render(html){
  screen.classList.remove("screen");
  screen.innerHTML=html;
  void screen.offsetWidth;
  screen.classList.add("screen");
  window.scrollTo(0,0);
}

function setProgress(n){
  progress.innerHTML="";
  for(let i=0;i<5;i++){
    const bar=document.createElement("span");
    if(i<n)bar.className="active";
    progress.appendChild(bar);
  }
}

function start(){
  step=0;
  answers=[];
  firstName="";
  selectedAffirmation=0;
  showQuestion();
}

function showQuestion(){
  setProgress(step+1);
  const q=questions[step];

  let html=`
    <div class="eyebrow">Question ${step+1} sur 3</div>
    <div class="symbol">✧</div>
    <h2>${q.heading}</h2>
    <p class="bodytext">${q.title}</p>
    <div class="choices">`;

  q.options.forEach((option,i)=>{
    html+=`
      <button class="choice" onclick="answer(${i})">
        <span class="star">✦</span>${option[0]}
      </button>`;
  });

  html+="</div>";
  render(html);
}

function answer(i){
  answers.push(questions[step].options[i][1]);
  step++;
  if(step<questions.length){
    showQuestion();
  }else{
    showTransition();
  }
}

function showTransition(){
  setProgress(3);
  render(`
    <div class="symbol">✧</div>
    <div class="eyebrow">Un instant pour toi</div>
    <h2>Tu viens de mettre<br><em>des mots sur quelque chose.</em></h2>
    <p class="bodytext">
      Peut-être que certaines de ces pensées t'accompagnent
      depuis longtemps.
      <br><br>
      Maintenant, imagine un instant que cette petite voix
      ne décide plus systématiquement à ta place...
    </p>
    <button class="primary" onclick="showReveal()">
      Découvrir ce qui se dessine ✦
    </button>
  `);
}

function determineProfile(){
  const scores={};
  const order=["place","regard","choix","intuition","merite"];
  order.forEach(k=>scores[k]=0);
  answers.forEach(k=>scores[k]++);

  profile=answers[0];

  order.forEach(k=>{
    if(scores[k]>scores[profile])profile=k;
  });
}

function showReveal(){
  determineProfile();
  setProgress(4);
  const p=categories[profile];

  render(`
    <div class="eyebrow">Le miroir de tes pensées</div>
    <div class="paper">
      <h2>${p.title}</h2>
      <p>Une pensée qui pourrait parfois revenir :</p>
      <div class="goldline"></div>
      <p style="font-size:23px;font-style:italic">
        « ${p.old} »
      </p>
      <div class="goldline"></div>
      <p>${p.insight}</p>
    </div>
    <p class="small" style="margin-top:25px">
      Ce résultat est une piste de réflexion,
      construite à partir de tes réponses.
      Il ne définit pas qui tu es.
    </p>
    <button class="primary" onclick="showAffirmations()">
      Choisir de nouveaux mots ✦
    </button>
  `);
}

function getAffirmations(){
  const result=[];
  const seen=new Set();

  answers.forEach(key=>{
    if(!seen.has(key)){
      seen.add(key);
      result.push(categories[key].affirmation);
    }
  });

  if(result.length===1){
    const extras={
      place:[
        "J'ai le droit d'apprendre en avançant.",
        "Je peux prendre ma place à mon rythme."
      ],
      regard:[
        "Mon avis compte autant que celui des autres.",
        "Je peux choisir ce qui me ressemble."
      ],
      choix:[
        "Je peux me choisir sans culpabiliser.",
        "Je respecte aussi mes propres besoins."
      ],
      intuition:[
        "Ma voix intérieure mérite mon attention.",
        "Je peux faire confiance à mon discernement."
      ],
      merite:[
        "Je peux accueillir ce qui me fait du bien.",
        "Ma valeur ne dépend pas de ce que je réussis."
      ]
    };
    result.push(...extras[answers[0]]);
  }

  if(result.length===2){
    result.push("Je m'autorise à avancer à mon rythme.");
  }

  return result.slice(0,3);
}

function showAffirmations(){
  const affirmations=getAffirmations();
  let html=`
    <div class="eyebrow">Les mots que je choisis</div>
    <div class="symbol">✦</div>
    <h2>Et si tu commençais<br><em>à te parler autrement ?</em></h2>
    <p class="bodytext">
      Voici trois phrases inspirées de tes réponses.
      Choisis celle qui résonne le plus en toi aujourd'hui.
    </p>
    <div class="choices">`;

  affirmations.forEach((a,i)=>{
    html+=`
      <button class="choice" onclick="chooseAffirmation(${i})">
        <span class="star">✧</span>${escapeHTML(a)}
      </button>`;
  });

  html+="</div>";
  render(html);
}

function chooseAffirmation(i){
  selectedAffirmation=i;
  setProgress(5);

  render(`
    <div class="eyebrow">Ton nouveau chapitre</div>
    <div class="symbol">✧</div>
    <h2>Et maintenant,<br><em>parlons de toi.</em></h2>
    <p class="bodytext">
      Ton mantra va commencer par ton prénom,
      comme une promesse que tu te fais à toi-même.
    </p>
    <label class="small" for="firstname"
      style="display:block;margin-bottom:12px">
      COMMENT T'APPELLES-TU ?
    </label>
    <input id="firstname" maxlength="35"
      autocomplete="given-name"
      placeholder="Ton prénom">
    <button class="primary" onclick="showMantra()">
      Révéler mon mantra ✦
    </button>
  `);
}

function getMantra(){
  const affirmations=getAffirmations();
  const chosen=affirmations[selectedAffirmation];
  const lines=[
    "Moi, "+(firstName||"moi")+",",
    "",
    chosen
  ];

  const other=affirmations.filter((_,i)=>i!==selectedAffirmation);
  lines.push(...other);

  lines.push(
    "Je m'autorise à avancer à mon rythme.",
    "J'écoute ce qui est important pour moi.",
    "Je respecte mes besoins.",
    "Je laisse grandir la confiance en moi.",
    "Je mérite une vie qui me ressemble.",
    "Je me choisis.",
    "Je suis à ma place.",
    "Je suis moi."
  );

  return [...new Set(lines)].join("\n");
}

function showMantra(){
  const input=document.getElementById("firstname");
  if(input)firstName=input.value.trim().slice(0,35);

  const mantra=getMantra();
  const p=categories[profile];

  render(`
    <div class="eyebrow">Ton mantra personnel</div>
    <div class="paper">
      <div class="eyebrow">Les mots que je choisis</div>
      <h2>Je réécris<br>mon histoire</h2>
      <div class="goldline"></div>
      <div class="mantra">${escapeHTML(mantra)}</div>
      <div class="goldline"></div>
      <p style="font-size:12px">
        Les soins de lumière d'Aurore
      </p>
    </div>

    <button class="primary" onclick="copyMantra()">
      Copier mon mantra ✦
    </button>
    <button class="secondary" onclick="downloadMantra()">
      Enregistrer mon mantra en texte
    </button>
    <p id="feedback" class="small" role="status"></p>

    <div class="goldline"></div>
    <div class="eyebrow">Ton premier petit pas</div>
    <p class="quote">${p.action}</p>
    <p class="bodytext">
      Les mots peuvent ouvrir une porte.
      Et parfois, un tout petit geste suffit
      pour commencer à leur donner une place.
    </p>

    <div class="goldline"></div>
    <h2>Et si tu allais<br><em>un peu plus loin ?</em></h2>
    <p class="bodytext">
      Certaines croyances nous accompagnent
      depuis longtemps.
      <br><br>
      Si tu ressens l'envie d'explorer plus
      profondément ce qui te freine,
      je t'invite à découvrir
      mon accompagnement Alchimie Cellulaire.
    </p>
    <button class="secondary" onclick="start()">
      Recommencer l'expérience
    </button>
  `);
}

function copyMantra(){
  const text=getMantra();
  const feedback=document.getElementById("feedback");

  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>{
      feedback.textContent="Ton mantra est copié ✨";
    }).catch(()=>fallbackCopy(text));
  }else{
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const area=document.createElement("textarea");
  area.value=text;
  area.style.position="fixed";
  area.style.opacity="0";
  document.body.appendChild(area);
  area.select();

  let success=false;
  try{
    success=document.execCommand("copy");
  }catch(e){}

  area.remove();

  document.getElementById("feedback").textContent=
    success?"Ton mantra est copié ✨":
    "Sélectionne ton mantra pour le copier.";
}

function downloadMantra(){
  const blob=new Blob([getMantra()],{
    type:"text/plain;charset=utf-8"
  });
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;
  link.download="mon-mantra-personnel.txt";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
</script>
</body>
</html>
