
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22160f">
<title>Les mots que je me raconte</title>
<style>
:root{
  --dark:#22160f;
  --brown:#4a3022;
  --gold:#d9b47e;
  --copper:#a87443;
  --cream:#fbf6ee;
  --ivory:#f5ede1;
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--dark)}
body{
  margin:0;
  min-height:100vh;
  color:var(--cream);
  font-family:Georgia,serif;
  background:radial-gradient(ellipse at 50% 25%,#62402d 0%,#352116 43%,#1c120d 100%);
}
body:before{
  content:"";
  position:fixed;inset:0;pointer-events:none;
  background-image:radial-gradient(#f5d7a1 1px,transparent 1px);
  background-size:37px 43px;
  opacity:.15;
}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:4px;
}
.app{
  position:relative;
  z-index:1;
  max-width:620px;
  min-height:100dvh;
  margin:auto;
  padding:30px 23px 50px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.top{
  text-align:center;
  color:var(--gold);
  letter-spacing:3px;
  font:10px Arial,sans-serif;
  text-transform:uppercase;
  margin-bottom:32px;
}
.progress{
  display:flex;gap:7px;
  margin-bottom:36px;
}
.progress span{
  flex:1;height:2px;
  background:#8c6a4a;
  opacity:.35;
}
.progress span.active{
  background:var(--gold);opacity:1;
}
.screen{animation:appear .55s ease both}
@keyframes appear{
  from{opacity:0;transform:translateY(17px)}
  to{opacity:1;transform:translateY(0)}
}
.symbol{
  text-align:center;
  font-size:43px;
  color:var(--gold);
  margin-bottom:23px;
  text-shadow:0 0 30px #d9b47e77;
}
.eyebrow{
  text-align:center;
  text-transform:uppercase;
  letter-spacing:3px;
  font:11px Arial,sans-serif;
  color:var(--gold);
  margin-bottom:20px;
}
h1,h2{
  text-align:center;
  font-weight:normal;
  line-height:1.17;
  margin:0 0 25px;
}
h1{font-size:clamp(42px,10vw,68px)}
h2{font-size:clamp(30px,7vw,43px)}
em{color:var(--gold);font-weight:normal}
.intro,.bodytext{
  text-align:center;
  line-height:1.85;
  font-size:17px;
  color:#ead9c7;
  margin:0 auto 28px;
  max-width:460px;
}
.small{
  font-size:13px;
  line-height:1.7;
  color:#c9ac91;
  text-align:center;
}
.goldline{
  width:75px;height:1px;
  margin:25px auto;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.primary{
  display:block;
  width:100%;
  border:1px solid #d9b47e;
  border-radius:50px;
  padding:19px 22px;
  background:linear-gradient(120deg,#e6c79a,#bc8c55);
  color:#2a1a10;
  font-size:15px;
  font-weight:bold;
  margin:22px 0 12px;
}
.secondary{
  display:block;
  width:100%;
  border:1px solid #9d7756;
  border-radius:40px;
  background:transparent;
  color:var(--gold);
  padding:15px;
  margin-top:12px;
}
.choices{display:grid;gap:12px;margin:25px 0}
.choice{
  width:100%;
  text-align:left;
  background:#f5ede10d;
  color:var(--cream);
  border:1px solid #d9b47e55;
  border-radius:17px;
  padding:19px 20px;
  line-height:1.5;
  font-size:16px;
  transition:background .2s,border-color .2s;
}
.choice.selected{
  background:#d9b47e27;
  border-color:var(--gold);
}
.choice .num{
  color:var(--gold);
  margin-right:10px;
  font-size:13px;
}
.paper{
  background:linear-gradient(145deg,#fffaf0,#e8d5bb);
  color:var(--brown);
  border-radius:8px;
  padding:33px 24px;
  box-shadow:0 12px 50px #0005;
  position:relative;
  text-align:center;
}
.paper:before{
  content:"✦";
  display:block;
  font-size:24px;
  color:var(--copper);
  margin-bottom:17px;
}
.paper h2{color:var(--brown)}
.paper p{line-height:1.85}
.paper .eyebrow{color:#936b46}
.paper .goldline{background:var(--copper)}
.mantra{
  font-size:18px;
  line-height:2.05;
  white-space:pre-line;
  color:#4a3022;
}
input{
  width:100%;
  background:#fff8eb;
  border:1px solid var(--copper);
  border-radius:12px;
  padding:17px;
  color:var(--brown);
  font-size:17px;
  text-align:center;
}
.quote{
  font-style:italic;
  color:var(--gold);
  text-align:center;
  font-size:22px;
  line-height:1.65;
  margin:24px 0;
}
.footer{
  text-align:center;
  color:#b99a7d;
  font:10px Arial,sans-serif;
  margin-top:38px;
  letter-spacing:1px;
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>
<body>
<main class="app">
  <div class="top">Les soins de lumière d'Aurore</div>
  <div id="progress" class="progress"></div>
  <section id="screen" class="screen" aria-live="polite">
    <div class="symbol">✧</div>
    <h1>Les mots que<br><em>je me raconte</em></h1>
    <p class="intro">
      Il y a des mots que tu te répètes depuis
      si longtemps que tu as fini par les croire.
    </p>
    <button class="primary" onclick="start()">
      Découvrir mes mots ✦
    </button>
  </section>
  <footer class="footer">UNE EXPÉRIENCE INTÉRIEURE ✧</footer>
</main>
<script>
"use strict";

const screen=document.getElementById("screen");
const progress=document.getElementById("progress");

let step=0;
let answers=[];
let chosenAffirmation=0;
let firstName="";
let profile="place";

const profiles={
  place:{
    title:"La place que tu t'autorises",
    thought:"Je dois encore prouver que je suis assez.",
    insight:"Tu sembles parfois attendre d'être certaine de ta valeur avant de t'autoriser à avancer. Et si tu pouvais commencer à prendre ta place, même avec tes doutes ?",
    affirmations:[
      "J'ai le droit de prendre ma place, à mon rythme.",
      "Ma présence a de la valeur.",
      "Je peux avancer même lorsque je doute."
    ],
    action:"Aujourd'hui, exprime une envie ou une opinion que tu aurais habituellement gardée pour toi."
  },
  regard:{
    title:"Le regard des autres",
    thought:"Que vont-ils penser de moi ?",
    insight:"Il arrive peut-être que l'avis des autres prenne tellement de place que tu oublies ce que toi, tu souhaites vraiment. Ton ressenti mérite aussi d'être entendu.",
    affirmations:[
      "Je m'autorise à être moi, même si je ne plais pas à tout le monde.",
      "Mon avis compte autant que celui des autres.",
      "Je peux choisir ce qui me ressemble."
    ],
    action:"Fais un petit choix aujourd'hui sans demander l'avis de quelqu'un d'autre."
  },
  choix:{
    title:"La permission de te choisir",
    thought:"Je dois penser aux autres avant moi.",
    insight:"Tu as peut-être pris l'habitude de faire passer les besoins des autres avant les tiens. Pourtant, ce dont tu as besoin mérite aussi une place dans ta vie.",
    affirmations:[
      "Mes besoins ont aussi leur importance.",
      "Je peux prendre soin de moi sans culpabiliser.",
      "Je m'autorise à me choisir."
    ],
    action:"Accorde-toi quinze minutes pour quelque chose qui te fait du bien, simplement parce que tu en as envie."
  },
  intuition:{
    title:"La confiance en ta voix intérieure",
    thought:"Et si je me trompais ?",
    insight:"Tu ressens peut-être certaines choses très clairement, avant de commencer à les remettre en question. Tu peux apprendre à écouter ton intuition tout en gardant ton discernement.",
    affirmations:[
      "J'apprends à écouter ce que je ressens.",
      "Je peux faire confiance à mon discernement.",
      "Ma voix intérieure mérite mon attention."
    ],
    action:"Note un ressenti que tu as aujourd'hui, sans chercher immédiatement à le faire valider."
  },
  merite:{
    title:"Le droit de recevoir",
    thought:"Je ne mérite peut-être pas tout ça.",
    insight:"Il se peut que tu aies du mal à accueillir ce qui est bon pour toi, comme s'il fallait toujours en faire davantage pour le mériter. Et si tu t'autorisais à recevoir un peu plus ?",
    affirmations:[
      "Je mérite de vivre des choses qui me font du bien.",
      "Je peux accueillir ce qui vient à moi.",
      "Je m'autorise à recevoir sans devoir tout justifier."
    ],
    action:"Aujourd'hui, accueille un compliment ou une attention avec un simple merci."
  }
};

const questions=[
  {
    title:"Tu as envie de faire quelque chose pour toi...",
    text:"Mais au moment de passer à l'action, une petite voix se fait entendre. Elle te dit quoi ?",
    options:[
      ["Je ne suis peut-être pas à la hauteur.","place"],
      ["Les autres vont me juger.","regard"],
      ["Je devrais plutôt penser aux autres.","choix"],
      ["Et si mon ressenti était faux ?","intuition"],
      ["Je ne mérite peut-être pas cette chance.","merite"]
    ]
  },
  {
    title:"Imagine qu'une belle opportunité se présente...",
    text:"Elle te donne envie, mais elle te fait aussi un peu peur. Qu'est-ce qui te freine le plus ?",
    options:[
      ["J'ai peur de ne pas être capable.","place"],
      ["J'ai peur de décevoir ou d'être critiquée.","regard"],
      ["Je culpabilise de faire quelque chose pour moi.","choix"],
      ["Je remets en question mon premier ressenti.","intuition"],
      ["J'ai l'impression que c'est trop beau pour moi.","merite"]
    ]
  },
  {
    title:"Quand tu repenses à ta journée...",
    text:"Quelle situation te laisse le plus souvent un petit pincement au cœur ?",
    options:[
      ["Ne pas avoir osé m'affirmer.","place"],
      ["Avoir changé d'avis pour plaire.","regard"],
      ["M'être oubliée en faisant passer tout le monde avant.","choix"],
      ["Ne pas avoir écouté ce que je ressentais.","intuition"],
      ["Avoir minimisé quelque chose de beau qui m'est arrivé.","merite"]
    ]
  }
];

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[c]);
}

function setScreen(html){
  screen.classList.remove("screen");
  screen.innerHTML=html;
  void screen.offsetWidth;
  screen.classList.add("screen");
  window.scrollTo(0,0);
}

function setProgress(n){
  progress.innerHTML="";
  for(let i=0;i<5;i++){
    const bar=document.createElement("span");
    if(i<n)bar.className="active";
    progress.appendChild(bar);
  }
}

function start(){
  answers=[];
  step=0;
  question();
}

function question(){
  setProgress(step+1);
  const q=questions[step];
  let html=`
    <div class="eyebrow">Fragment ${step+1} sur 3</div>
    <div class="symbol">✧</div>
    <h2>${q.title}</h2>
    <p class="bodytext">${q.text}</p>
    <div class="choices">`;

  q.options.forEach((option,i)=>{
    html+=`
      <button class="choice" onclick="answer(${i})">
        <span class="num">0${i+1} ✦</span>
        ${option[0]}
      </button>`;
  });

  html+="</div>";
  setScreen(html);
}

function answer(i){
  answers.push(questions[step].options[i][1]);
  step++;
  if(step<questions.length)question();
  else reveal();
}

function determineProfile(){
  const scores={};
  const order=["place","regard","choix","intuition","merite"];
  order.forEach(k=>scores[k]=0);
  answers.forEach(k=>scores[k]++);
  profile=order.reduce((best,k)=>
    scores[k]>scores[best]?k:best
  ,answers[0]||"place");
}

function reveal(){
  determineProfile();
  setProgress(4);
  const p=profiles[profile];

  setScreen(`
    <div class="eyebrow">Ce qui se dessine</div>
    <div class="paper">
      <h2>${p.title}</h2>
      <p>Une pensée qui pourrait parfois revenir :</p>
      <div class="goldline"></div>
      <p style="font-size:23px;font-style:italic">
        « ${p.thought} »
      </p>
      <div class="goldline"></div>
      <p>${p.insight}</p>
    </div>
    <p class="small" style="margin-top:25px">
      C'est une piste de réflexion à partir de tes réponses,
      pas une vérité définitive sur toi.
    </p>
    <button class="primary" onclick="chooseWords()">
      Et si je choisissais d'autres mots ? ✦
    </button>
  `);
}

function chooseWords(){
  const p=profiles[profile];
  setProgress(4);
  let html=`
    <div class="eyebrow">Le pouvoir de choisir</div>
    <div class="symbol">✦</div>
    <h2>Quels mots veux-tu<br><em>t'offrir aujourd'hui ?</em></h2>
    <p class="bodytext">
      Tu n'as pas besoin de croire immédiatement
      chaque mot. Choisis simplement la phrase
      qui te fait du bien, celle que tu aimerais
      apprendre à accueillir.
    </p>
    <div class="choices">`;

  p.affirmations.forEach((a,i)=>{
    html+=`
      <button class="choice" onclick="selectWords(${i})">
        <span class="num">✧</span>${a}
      </button>`;
  });

  html+="</div>";
  setScreen(html);
}

function selectWords(i){
  chosenAffirmation=i;
  setProgress(5);
  setScreen(`
    <div class="eyebrow">Ton nouveau chapitre</div>
    <div class="symbol">✧</div>
    <h2>Et maintenant,<br><em>parlons de toi.</em></h2>
    <p class="bodytext">
      Comment souhaites-tu que ton mantra s'adresse à toi ?
    </p>
    <label for="firstname" class="small"
      style="display:block;margin-bottom:12px">
      TON PRÉNOM
    </label>
    <input id="firstname" maxlength="35"
      placeholder="Ton prénom" autocomplete="given-name">
    <button class="primary" onclick="makeMantra()">
      Révéler mon mantra ✦
    </button>
  `);
}

function buildMantra(){
  const p=profiles[profile];
  const name=firstName?firstName:"moi";
  return [
    "Moi, "+name+",",
    "",
    p.affirmations[chosenAffirmation],
    "Je m'autorise à avancer à mon rythme.",
    "J'écoute ce qui est important pour moi.",
    "Je respecte mes besoins.",
    "Je laisse grandir la confiance en moi.",
    "Je mérite une vie qui me ressemble.",
    "Chaque petit pas compte.",
    "Je me choisis.",
    "Je suis à ma place.",
    "Je suis moi."
  ].join("\n");
}

function makeMantra(){
  const input=document.getElementById("firstname");
  firstName=input.value.trim().slice(0,35);
  showMantra();
}

function showMantra(){
  const p=profiles[profile];
  const mantra=buildMantra();

  setScreen(`
    <div class="eyebrow">Les mots que je choisis</div>
    <div class="paper" id="mantraCard">
      <div class="eyebrow">Mon mantra personnel</div>
      <h2>Je réécris<br>mon histoire</h2>
      <div class="goldline"></div>
      <div class="mantra">${escapeHTML(mantra)}</div>
      <div class="goldline"></div>
      <p style="font-size:12px">
        Les soins de lumière d'Aurore
      </p>
    </div>
    <button class="primary" onclick="copyMantra()">
      Copier mon mantra ✦
    </button>
    <button class="secondary" onclick="saveMantra()">
      Enregistrer mon mantra en texte
    </button>
    <div class="goldline"></div>
    <div class="eyebrow">Ton premier petit pas</div>
    <p class="quote">${p.action}</p>
    <p class="bodytext">
      Les mots peuvent ouvrir une porte.
      Ce sont aussi les petits gestes du quotidien
      qui leur donnent une place dans ta vie.
    </p>
    <div class="goldline"></div>
    <h2>Et si tu allais<br><em>un peu plus loin ?</em></h2>
    <p class="bodytext">
      Certaines croyances nous accompagnent depuis
      longtemps. Les reconnaître est un premier pas.
      Si tu ressens l'envie de les explorer plus
      profondément, je t'invite à découvrir
      mon accompagnement Alchimie Cellulaire.
    </p>
    <button class="secondary" onclick="restart()">
      Recommencer l'expérience
    </button>
    <p id="feedback" class="small" role="status"></p>
  `);
}

function copyMantra(){
  const text=buildMantra();
  const feedback=document.getElementById("feedback");

  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>{
      feedback.textContent="Ton mantra est copié ✨";
    }).catch(()=>fallbackCopy(text));
  }else{
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const area=document.createElement("textarea");
  area.value=text;
  area.style.position="fixed";
  area.style.opacity="0";
  document.body.appendChild(area);
  area.select();
  let ok=false;
  try{ok=document.execCommand("copy")}catch(e){}
  area.remove();
  document.getElementById("feedback").textContent=
    ok?"Ton mantra est copié ✨":
    "Tu peux sélectionner et copier ton mantra ci-dessus.";
}

function saveMantra(){
  const blob=new Blob([buildMantra()],{
    type:"text/plain;charset=utf-8"
  });
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="mon-mantra-personnel.txt";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

function restart(){
  firstName="";
  chosenAffirmation=0;
  start();
}
</script>
</body>
</html>
